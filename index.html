<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2d">
  <meta name="description" content="Digitale Lernangebote aus dem Seminar Didaktik der Algebra. Interaktive Anwendungen zu Brüchen und ihren Darstellungen.">
  <title>Didáctica de Álgebra · Digital entdecken</title>
  <style>
    :root{color-scheme:dark;--ink:#f4f8ff;--muted:#cfdeec;--panel:rgba(8,25,43,.78);--line:rgba(207,232,255,.22);--cyan:#78e4ef;--gold:#ffd488}
    *{box-sizing:border-box}
    html{min-height:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#061626 url("assets/algebra-seminar.jpg") center/cover fixed no-repeat;}
    body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(3,15,28,.38),rgba(3,14,27,.84) 56%,rgba(3,13,25,.94))}
    a{color:inherit}
    .wrap{width:min(1160px,calc(100% - 40px));margin:auto}
    header{padding:clamp(48px,9vh,100px) 0 38px;text-align:center}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border:1px solid rgba(120,228,239,.36);border-radius:999px;background:rgba(6,27,46,.58);color:#c6f7fa;font-size:.77rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(12px)}
    .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
    h1{max-width:850px;margin:22px auto 15px;font-size:clamp(2.2rem,5.5vw,4.6rem);line-height:1.02;letter-spacing:-.045em;text-shadow:0 5px 34px rgba(0,0,0,.48)}
    h1 span{color:var(--cyan)}
    .intro{max-width:730px;margin:0 auto;color:#e2edf7;font-size:clamp(1rem,1.65vw,1.18rem);line-height:1.65;text-shadow:0 2px 12px #00101d}
    main{padding:14px 0 64px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 0 18px}
    .section-head h2{margin:0;font-size:1.1rem;letter-spacing:.02em}
    .count{color:var(--muted);font-size:.9rem}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 34px;max-width:1080px;margin:0 auto}
    .card{--accent:var(--cyan);position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:linear-gradient(155deg,rgba(13,39,60,.94),var(--panel));text-decoration:none;box-shadow:0 18px 48px rgba(0,0,0,.26);backdrop-filter:blur(14px);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
    .card:hover,.card:focus-visible{transform:translateY(-7px) scale(1.012);border-color:color-mix(in srgb,var(--accent),white 28%);box-shadow:0 24px 58px rgba(0,0,0,.42);outline:none}
    .card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .card:nth-child(2){--accent:#ffd488;transform:translateY(42px)}.card:nth-child(3){--accent:#c5a9ff;transform:translateY(-8px)}.card:nth-child(4){--accent:#9ee6aa;transform:translateY(34px)}
    .visual{height:270px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 110%,color-mix(in srgb,var(--accent),transparent 72%),transparent 66%),linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,0))}
    .visual::after{content:"";position:absolute;inset:auto 16px 0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
    .visual svg{width:min(94%,380px);height:235px;filter:drop-shadow(0 12px 16px rgba(0,0,0,.22))}
    .body{padding:18px 22px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex:1}
    .topic{margin:0 0 8px;color:var(--accent);font-size:.72rem;line-height:1.25;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h3{margin:0;font-size:clamp(1.25rem,2vw,1.65rem);line-height:1.2;letter-spacing:-.02em}
    .desc{margin:0;color:#d4e2ee;font-size:.91rem;line-height:1.55;min-height:4.2em}
    .meta{margin:16px 0 0;color:#a9bdcd;font-size:.8rem}
    .open{display:flex;align-items:center;justify-content:space-between;margin-top:19px;padding-top:13px;border-top:1px solid rgba(255,255,255,.12);color:#f7fbff;font-size:.87rem;font-weight:750}
    .arrow{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;color:#061626;background:var(--accent);font-size:1rem;transition:transform .2s ease}
    .card:hover .arrow{transform:translateX(3px)}
    .notice{display:flex;gap:13px;align-items:flex-start;margin:25px 0 0;padding:17px 19px;border:1px solid rgba(207,232,255,.17);border-radius:15px;background:rgba(5,20,35,.62);color:#c7d8e6;font-size:.87rem;line-height:1.55;backdrop-filter:blur(10px)}
    .notice strong{color:#f4f8ff;white-space:nowrap}
    footer{padding:0 0 28px;text-align:center;color:#aec1d1;font-size:.78rem}
    @media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.visual{height:235px}.card:nth-child(2),.card:nth-child(3),.card:nth-child(4){transform:none}}
    @media(max-width:560px){.wrap{width:min(100% - 26px,440px)}header{padding-top:46px;padding-bottom:22px}.grid{grid-template-columns:1fr;gap:16px}.visual{height:210px}.body{padding:15px 18px 18px}body{background-attachment:scroll}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
